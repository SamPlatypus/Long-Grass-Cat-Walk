<title>Long Grass Cat Walk</title>
<style>
/* One-screen canvas game; menu as a small floating panel centred at the bottom. Single dark look by choice. */
:root{
  --panel: rgba(14,20,17,.66);
  --panel-line: rgba(232,240,226,.16);
  --ink: #eaf0e4;
  --ink-soft: rgba(234,240,228,.62);
  --btn: rgba(255,255,255,.09);
  --accent: #c3d4a8;
  --bg: #0d1412;
  --font-ui: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.msg{position:fixed;left:50%;top:21%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);
  text-align:center;font-family:var(--font-ui);background:rgba(8,13,11,.66);border-radius:16px;
  padding:12px 18px;transition:opacity 1.4s ease;pointer-events:none;box-sizing:border-box}
.msg p{margin:0;font-size:21px;line-height:1.35;text-wrap:balance}
.msg p.sub{margin-top:8px;font-size:16px;color:var(--ink)}
.msg.fade{opacity:0}
.end{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.end p{font-size:24px}
button{font-family:var(--font-ui);font-size:14px;color:var(--ink);background:var(--btn);
  border:1px solid var(--panel-line);border-radius:11px;padding:7px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.off{color:rgba(234,240,228,.38);background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07)}
#menu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(320px, calc(100% - 28px));box-sizing:border-box;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:16px;padding:10px 14px 8px;font-family:var(--font-ui);font-size:13px;display:grid;gap:5px}
#menu .btns{display:flex;gap:8px;justify-content:center;margin-bottom:3px}
#menu label{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px}
#menu label span{color:var(--ink-soft)}
#menu input[type=range]{width:100%;margin:0;height:24px;accent-color:var(--accent)}
#menu .ends{display:flex;justify-content:space-between;padding-left:84px;margin-top:-6px;
  font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
#menu .trow{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px;margin-top:2px}
#menu .trow span{color:var(--ink-soft)}
#menu .seg{display:flex;gap:4px}
#menu .seg button{flex:1;padding:4px 0;font-size:12px;border-radius:9px}
#menu .seg button.sel{background:rgba(195,212,168,.26);border-color:rgba(195,212,168,.55)}
#menu .credit{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:2px;letter-spacing:.02em}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4px + env(safe-area-inset-bottom,0px));
  width:min(330px, calc(100% - 28px));display:grid;gap:0;font-family:var(--font-ui)}
#bar .pace{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:12px;
  color:rgba(242,246,238,.82);text-shadow:0 1px 3px rgba(0,0,0,.65);letter-spacing:.03em}
#bar input{width:100%;margin:0;height:32px;accent-color:var(--accent);opacity:.9}
#bar .row{display:flex;justify-content:center;align-items:center;gap:4px}
#snd2{padding:5px 13px;font-size:13px;background:rgba(14,20,17,.32)}
#dots{background:none;border:none;padding:12px 14px;display:flex;gap:7px}
#dots i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(240,244,236,.78)}
@media (prefers-reduced-motion: reduce){.msg{transition:none}}
</style>

<canvas id="c" aria-label="A grey cat's view walking through long grass"></canvas>

<div id="msg" class="msg">
  <p>Welcome, little grey ninja cat.</p>
  <p class="sub">Tap to walk through the long grass. Tap again to rest.</p>
  <p class="sub">Tap the little critters as you pass.</p>
</div>

<div id="end" class="msg end" hidden>
  <p>You've arrived. Welcome Home.</p>
  <p class="sub">Tap around and enjoy the cozy nook.</p>
  <button id="again" type="button">Walk again</button>
</div>

<div id="menu">
  <div class="btns">
    <button id="snd" type="button">Sound</button>
    <button id="hide" type="button">Hide menu</button>
  </div>
  <label><span>Volume</span><input id="vol" type="range" min="0" max="100"></label>
  <label><span>Wind</span><input id="wind" type="range" min="0" max="100"></label>
  <label><span>Footsteps</span><input id="steps" type="range" min="0" max="100"></label>
  <label><span>Music</span><input id="music" type="range" min="0" max="100"></label>
  <label><span>Pace</span><input id="pace" type="range" min="0" max="100"></label>
  <div class="ends"><span>stalk</span><span>zoomies</span></div>
  <label><span>Glow</span><input id="glow" type="range" min="30" max="100"></label>
  <div class="trow"><span>Time</span><div class="seg"><button type="button" data-t="now">Now</button><button type="button" data-t="flip">Flipped</button><button type="button" data-t="night">Night</button></div></div>
  <div class="credit">by @SamAndNinjaCat</div>
</div>
<div id="bar" hidden>
  <div class="pace"><span>stalk</span><input id="pace2" type="range" min="0" max="100" aria-label="Pace"><span>zoomies</span></div>
  <div class="row"><button id="snd2" type="button">Sound</button><button id="dots" type="button" aria-label="Show menu"><i></i><i></i><i></i></button></div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, R = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mixA = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const sgn = v => v < 0 ? -1 : 1;
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const ROUTE = 400;        // metres of walk; about 7 minutes at the default pace
const STEP = 0.17;        // spawn spacing (m)
const ZFAR = 12;          // how far ahead the cat sees (m)

/* ---------- settings ---------- */
const S = { vol: 70, wind: 50, steps: 60, pace: 40, glow: 100, muted: false, time: 'now', music: 0 };
try { const s = JSON.parse(localStorage.getItem('longgrasscat.v1') || 'null'); if (s) Object.assign(S, s); } catch (e) {}
function saveS() { try { localStorage.setItem('longgrasscat.v1', JSON.stringify(S)); } catch (e) {} }

/* ---------- canvas ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W = 390, H = 800, DPR = 1, scale = 1, f = 450, hy = 450, cx = 195;
let stars = [], hills = [], trees = [], bandTips = [];
function resize() {
  W = Math.max(200, window.innerWidth || 390); H = Math.max(300, window.innerHeight || 800);
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  cv.width = Math.round(W * DPR * scale); cv.height = Math.round(H * DPR * scale);
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
  f = Math.min(W * 1.15, H * 0.72); hy = H * 0.56; cx = W / 2;
  skyGrad = null; groundGrad = null;
}
function buildBackdrop() {
  stars = []; for (let i = 0; i < 80; i++) stars.push([R(), Math.pow(R(), 1.3) * 0.52, 0.4 + R() * 0.9, R() * TAU]);
  hills = []; let v = 0.5; for (let i = 0; i <= 24; i++) { v = clamp(v + (R() - 0.5) * 0.5, 0.15, 1); hills.push(v); }
  trees = []; for (let i = 0; i < 70; i++) trees.push([R(), 0.35 + R() * 0.65, 0.006 + R() * 0.012]);
  bandTips = []; for (let i = 0; i < 64; i++) bandTips.push(0.35 + R() * 0.65);
}
window.addEventListener('resize', resize);

/* ---------- sky by phone clock ---------- */
const SKY = [ // hour, sky top, sky low, light, night, day
  [0, [13, 19, 40], [32, 42, 62], .6, 1, 0],
  [4.8, [13, 19, 40], [32, 42, 62], .6, 1, 0],
  [6, [62, 74, 112], [212, 164, 136], .72, .35, .4],
  [7.6, [118, 168, 212], [206, 222, 222], 1, 0, 1],
  [16.8, [118, 168, 212], [206, 222, 222], 1, 0, 1],
  [18.4, [72, 82, 128], [224, 162, 124], .74, .35, .4],
  [20, [15, 21, 44], [34, 44, 64], .6, 1, 0],
  [24, [13, 19, 40], [32, 42, 62], .6, 1, 0]];
const env = { top: [0, 0, 0], bot: [0, 0, 0], light: 1, night: 0, day: 1 };
let skyGrad = null, groundGrad = null, lastEnv = -99;
function updEnv() {
  const d = new Date(); let h = d.getHours() + d.getMinutes() / 60;
  if (S.time === 'flip') h = (h + 12) % 24; else if (S.time === 'night') h = 23;
  let i = 0; while (i < SKY.length - 2 && SKY[i + 1][0] <= h) i++;
  const a = SKY[i], b = SKY[i + 1];
  const t = clamp((h - a[0]) / (b[0] - a[0]), 0, 1), u = t * t * (3 - 2 * t);
  env.top = mixA(a[1], b[1], u); env.bot = mixA(a[2], b[2], u); env.light = lerp(a[3], b[3], u);
  env.night = lerp(a[4], b[4], u); env.day = lerp(a[5], b[5], u);
  skyGrad = null; groundGrad = null;
}
const rgb = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';

/* colour of a thing at distance z, lit by time of day and how open the spot is */
let openNow = 0.2, warmK = 0;
function shade(c, z, mul) {
  const L = env.light * (0.78 + 0.22 * openNow) * (mul || 1);
  let r = c[0] * L, g = c[1] * L, b = c[2] * L;
  const n = env.night * 0.5 * (1 - 0.65 * warmK); r += (46 - r) * n; g += (68 - g) * n; b += (86 - b) * n;
  if (warmK > 0) { r *= 1 + 0.28 * warmK; g *= 1 + 0.1 * warmK; b *= 1 - 0.14 * warmK; }
  const k = Math.min(1, z / ZFAR) * 0.72, hz = env.bot;
  r += (hz[0] - r) * k; g += (hz[1] - g) * k; b += (hz[2] - b) * k;
  return [r, g, b];
}
const shadeS = (c, z, mul) => rgb(shade(c, z, mul));
const SH = [
  [84, 132, 54], [102, 150, 60], [70, 114, 46],   // 0-2 long grass greens
  [140, 156, 76], [116, 146, 64],                 // 3-4 meadow grass
  [52, 98, 50],                                   // 5 fern
  [112, 96, 78],                                  // 6 bark
  [132, 128, 120],                                // 7 rock
  [178, 154, 90]];                                // 8 seed stalk
const LV = 10, tbl = new Array(SH.length * LV);
function buildTable() {
  for (let s = 0; s < SH.length; s++) for (let l = 0; l < LV; l++)
    tbl[s * LV + l] = l === 0 ? shadeS(SH[s], 0, 0.76) : shadeS(SH[s], (l - 0.5) / (LV - 1) * ZFAR, 1);
}
const lvl = z => z < 0.45 ? 0 : Math.min(LV - 1, 1 + ((z / ZFAR) * (LV - 1) | 0));
const col = (sh, z) => tbl[sh * LV + lvl(z)];

/* ---------- route: long grass tunnels with open meadow gaps ---------- */
let segs = [], dArr = null, meadows = [], rocks = [], rockIdx = 0, deer = null, ponds = [], pondIdx = 0, c4s = [], c4Idx = 0;
function makeRoute() {
  segs = []; let d = 0, t = true;
  while (true) {
    const len = t ? 28 + R() * 30 : 13 + R() * 12;
    if (d + len > ROUTE - 22) break;
    segs.push({ s: d, e: d + len, t: t ? 1 : 0 }); d += len; t = !t;
  }
  const last = segs[segs.length - 1];
  if (last && last.t === 1) last.e = ROUTE - 9; else segs.push({ s: d, e: ROUTE - 9, t: 1 });
  segs.push({ s: ROUTE - 9, e: ROUTE + 2, t: 0.12 });      // the little clearing with the bed
  segs.push({ s: ROUTE + 2, e: ROUTE + 60, t: 1 });        // grass wall behind it
  const N = Math.ceil((ROUTE + 60) / 0.5) + 1, raw = new Float32Array(N);
  let si = 0;
  for (let i = 0; i < N; i++) { const x = i * 0.5; while (si < segs.length - 1 && x >= segs[si].e) si++; raw[i] = segs[si].t; }
  dArr = new Float32Array(N); const rad = 6;
  for (let i = 0; i < N; i++) { let s = 0, c = 0; for (let j = -rad; j <= rad; j++) { const k = clamp(i + j, 0, N - 1); s += raw[k]; c++; } dArr[i] = s / c; }
  meadows = segs.filter(s => s.t === 0);
  rocks = []; for (const m of meadows) if (R() < 0.75) rocks.push(m.s + (m.e - m.s) * (0.35 + R() * 0.3));
  rockIdx = 0;
  ponds = [];
  for (const m of meadows) if (R() < 0.65) {
    const r = 0.28 + R() * 0.12, fr = R() < 0.5 ? 0.15 + R() * 0.12 : 0.73 + R() * 0.12;
    ponds.push({ z: m.s + (m.e - m.s) * fr, x: side() * (r + 0.14 + R() * 0.12), r });
  }
  ponds.sort((a, b) => a.z - b.z); pondIdx = 0;
  c4s = []; const n4 = 4 + (R() < 0.5 ? 1 : 0);
  for (let i = 0; i < n4; i++) c4s.push(ROUTE * (0.06 + 0.86 * (i + 0.1 + R() * 0.8) / n4));
  c4Idx = 0;
  const late = meadows.filter(m => m.s > ROUTE * 0.28);
  deer = null;
  const pool = late.length ? late : meadows;
  if (pool.length) { const m = pool[(R() * pool.length) | 0]; deer = { at: (m.s + m.e) / 2, on: false, done: false }; }
}
function inPond(wz, x) {
  for (const p of ponds) { const dz = wz - p.z; if (dz > -p.r - 0.06 && dz < p.r + 0.06) { const dx = x - p.x; if (dx * dx + dz * dz < (p.r + 0.05) * (p.r + 0.05)) return true; } }
  return false;
}
function dens(d) {
  const x = clamp(d / 0.5, 0, dArr.length - 1.001), i = x | 0, t = x - i;
  return dArr[i] * (1 - t) + dArr[i + 1] * t;
}

/* ---------- world state ---------- */
let objs = [], movers = [], parts = [];
let camD = 0, speed = 0, nextSpawn = 0.1, stepPh = 0, camH = 0.2, camX = 0;
let walking = false, started = false, ended = false, autoHold = false, endT = 0, bedSpawned = false;
let time = 0, frameNo = 0;
let pawVis = 0, pawStretchUntil = 0, nextPawStretch = 30, swipe = null, whiskT = -9;

const paceSpeed = () => 0.35 * Math.pow(12, S.pace / 100);   // 0.35 m/s stalk ... 4.2 m/s zoomies
const BUTTER = [[236, 196, 214], [196, 214, 240], [244, 226, 160], [202, 236, 204], [226, 204, 244], [246, 206, 176]];
const FLOWERS = [[238, 236, 224], [240, 208, 92], [194, 152, 204], [238, 236, 224]];

function mkClump(wz, x, hB, n, sh, ln, w) {
  const bl = [];
  for (let i = 0; i < n; i++) bl.push({
    dx: (i - (n - 1) / 2) * 0.017 + (R() - 0.5) * 0.012, h: hB * (0.65 + R() * 0.45),
    ln: ln + (R() - 0.5) * 0.2, ph: R() * TAU, sp: 1.0 + R() * 0.9, w: w * (0.8 + R() * 0.5) });
  objs.push({ k: 'g', wz, x, bl, sh, h: hB });
}
const side = () => R() < 0.5 ? -1 : 1;

function spawnAt(d) {
  const den = dens(d), op = 1 - den, from = objs.length;
  const jz = () => d + R() * STEP;
  const nearBed = d > ROUTE - 1.9 && d < ROUTE + 0.8;
  const night = env.night > 0.5;
  // long grass
  for (let n = den * 3.4; n > 0; n -= 1) if (n >= 1 || R() < n) {
    const s = side(); let x = s * (0.11 + Math.pow(R(), 2.1) * 1.1);
    if (nearBed && Math.abs(x) < 0.62) x = s * (0.62 + R() * 0.6);
    mkClump(jz(), x, (0.42 + R() * 0.5) * (0.55 + 0.45 * den), 2 + (R() * 3 | 0), R() * 3 | 0, -s * (0.04 + R() * 0.22), 0.0075);
  }
  // arching blades that make the tunnel roof
  if (den > 0.55 && !nearBed && R() < 0.85) { const s = side(); mkClump(jz(), s * (0.15 + R() * 0.3), 0.75 + R() * 0.35, 2 + (R() * 2 | 0), R() * 3 | 0, -s * (0.42 + R() * 0.35), 0.0065); }
  // short meadow grass
  for (let n = op * 4.2 + 0.45; n > 0; n -= 1) if (n >= 1 || R() < n) {
    const s = side(); let xs = s * (0.05 + Math.pow(R(), 1.5) * 1.1); if (nearBed && Math.abs(xs) < 0.62) continue; mkClump(jz(), xs, 0.05 + R() * 0.12, 3 + (R() * 3 | 0), 3 + (R() * 2 | 0), (R() - 0.5) * 0.3, 0.0042);
  }
  if (op > 0.4 && R() < 0.06 * op) objs.push({ k: 'stalk', wz: jz(), x: side() * (0.18 + R() * 1.1), h: 0.32 + R() * 0.3, ph: R() * TAU, seeds: 3 });
  if (op > 0.3 && R() < 0.1 * op) objs.push({ k: 'flow', wz: jz(), x: side() * (0.09 + R() * 0.9), h: 0.05 + R() * 0.09, c: FLOWERS[(R() * FLOWERS.length) | 0], ph: R() * TAU });
  if (den > 0.5 && R() < 0.026) { const s = side(); const fr = []; const n = 5 + (R() * 3 | 0); for (let i = 0; i < n; i++) fr.push({ a: (i / (n - 1) - 0.5) * 2.3 + (R() - 0.5) * 0.2, l: 0.8 + R() * 0.35, ph: R() * TAU }); objs.push({ k: 'fern', wz: jz(), x: s * (0.26 + R() * 0.45), sz: 0.3 + R() * 0.25, fr }); }
  if (op > 0.5 && R() < 0.01) objs.push(mkTree(jz(), side() * (1.6 + R() * 2.2), 0.14 + R() * 0.1));
  else if (den > 0.6 && R() < 0.003) objs.push(mkTree(jz(), side() * (0.75 + R() * 0.6), 0.14 + R() * 0.1));
  // critters: a little larger than life, in colours that pop out of the green; all of them day and night
  if (R() < 0.017) { const s = side(); objs.push(crit('gh', jz(), s * (0.13 + R() * 0.16), den > 0.4 ? 0.14 + R() * 0.16 : 0.06 + R() * 0.06)); }
  if (R() < 0.01) { const s = side(); objs.push(crit('lb', jz(), s * (0.13 + R() * 0.14), den > 0.4 ? 0.16 + R() * 0.18 : 0.08 + R() * 0.06)); }
  if (den > 0.45 && R() < 0.007) { const o = crit('ms', jz(), side() * (0.16 + R() * 0.06), 0); o.peek = R() * TAU; objs.push(o); }
  if (R() < (den < 0.5 ? 0.022 : 0.005)) objs.push(crit('dd', jz(), side() * (0.13 + R() * 0.35), 0.2 + R() * 0.12));
  if (den < 0.45 && R() < 0.006) { const o = crit('bd', jz(), side() * (0.16 + R() * 0.3), 0); o.hopT = R() * 2; o.hop = 0; objs.push(o); }
  if (night && R() < 0.012) { const o = crit('cr', jz(), side() * (0.13 + R() * 0.15), den > 0.4 ? 0.1 + R() * 0.14 : 0.05 + R() * 0.05); o.nc = time + R() * 2; objs.push(o); }
  if (R() < (den < 0.5 ? 0.02 : 0.004)) { const o = crit('pf', jz(), side() * (0.13 + R() * 0.3), 0.16 + R() * 0.14); o.cv = R() < 0.55 ? 0 : 1; objs.push(o); }
  if (R() < (den < 0.5 ? 0.006 : 0.0015)) { const o = crit('bb', jz() + 0.9, side() * (0.14 + R() * 0.2), 0.12 + R() * 0.08); o.hx = [o.x + (R() - 0.5) * 0.2, o.x]; o.hy = [0.12 + R() * 0.08, o.y]; o.hz = [-(0.45 + R() * 0.4), 0]; o.at = 0; o.from = 0; objs.push(o); }
  if (R() < (den > 0.5 ? 0.012 : 0.006)) objs.push(crit('sn', jz(), side() * (0.12 + R() * 0.08), 0.06 + R() * 0.1));
  if (R() < (den > 0.5 ? 0.003 : 0.002)) objs.push(crit('wb', jz(), side() * (0.2 + R() * 0.15), 0.2 + R() * 0.06));
  if (R() < (den > 0.5 ? 0.004 : 0.003)) objs.push(crit('cp', jz(), side() * (0.13 + R() * 0.14), 0.1 + R() * 0.1));
  if (c4Idx < c4s.length && d >= c4s[c4Idx]) { c4Idx++; objs.push(crit('c4', jz(), side() * (0.14 + R() * 0.12), 0.07 + R() * 0.04)); }
  if (movers.length < 6 && R() < (den < 0.5 ? 0.02 : 0.004)) {
    const moth = env.night > 0.5 && R() < 0.5;
    movers.push({ k: moth ? 'moth' : 'fly', wz: d, x0: side() * (0.1 + R() * 0.5), y0: 0.18 + R() * 0.3, ox: 0, oy: 0, vx: 0, vy: 0, ph: R() * TAU,
      c: moth ? [226, 218, 194] : BUTTER[(R() * BUTTER.length) | 0], dr: R() * TAU });
  }
  if (pondIdx < ponds.length && d >= ponds[pondIdx].z) {
    const p = ponds[pondIdx++];
    objs.push({ k: 'pond', wz: p.z, x: p.x, r: p.r, lp: R() * TAU, rips: [] });
    const fg = crit('fg', p.z - p.r * 0.15, p.x - sgn(p.x) * p.r * 0.82, 0); fg.nc = time + 1; objs.push(fg);
  }

      ctx.quadraticCurveTo(BX(-0.5), BY(0.86), BX(-0.56), BY(0.98));
      ctx.quadraticCurveTo(BX(-0.64), BY(1.2), BX(-0.58), BY(1.6));
      ctx.closePath(); ctx.fill();
      if (pass === 0) {
        ctx.fillStyle = shadeS([214, 198, 172], z, 1);
        ctx.beginPath(); ctx.moveTo(BX(0.36), BY(0.895)); ctx.quadraticCurveTo(BX(0.05), BY(0.86), BX(-0.24), BY(0.885)); ctx.lineTo(BX(-0.24), BY(0.93)); ctx.quadraticCurveTo(BX(0.05), BY(0.9), BX(0.36), BY(0.94)); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.ellipse(BX(-0.57), BY(1.03), 0.05 * s, 0.09 * s, 0, 0, TAU); ctx.fill();
      }
    }
    for (const lg of legs) {
      if (lg.far !== pass) continue;
      let p = ((d.g + lg.off) % 1 + 1) % 1;
      const front = lg.fx > 0;
      let lift, u;
      if (d.st === 1 && front && !lg.far) { lift = 0.12; u = 0.05; }
      else if (d.st === 1 || d.st === 3) { lift = 0; u = 0; }
      else if (p < 0.3) { lift = Math.sin(p / 0.3 * Math.PI) * 0.08; u = -0.12 + 0.24 * (p / 0.3); }
      else { lift = 0; u = 0.12 - 0.24 * ((p - 0.3) / 0.7); }
      const hipX = d.x + lg.fx * d.dir, footX = hipX + u * d.dir;
      const kneeX = (front ? lerp(hipX, footX, 0.55) + 0.02 * d.dir : hipX - 0.07 * d.dir), kneeY = 0.44 + lift * 0.6;
      const X = wx => cx + (wx - camX) * s, Y = wy => hy + (camHB - wy) * s;
      ctx.strokeStyle = c; ctx.lineCap = 'round';
      const tw0 = (front ? 0.06 : 0.085) * s, tw1 = 0.028 * s;
      ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(X(hipX) - tw0, Y(1.02)); ctx.lineTo(X(hipX) + tw0, Y(1.02)); ctx.lineTo(X(kneeX) + tw1, Y(kneeY)); ctx.lineTo(X(kneeX) - tw1, Y(kneeY)); ctx.fill();
      ctx.lineWidth = 0.024 * s; ctx.beginPath(); ctx.moveTo(X(kneeX), Y(kneeY)); ctx.lineTo(X(footX), Y(lift + 0.04)); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.fillStyle = hoof; const hw = 0.016 * s;
      ctx.beginPath(); ctx.moveTo(X(footX) - hw, Y(lift + 0.05)); ctx.lineTo(X(footX) + hw, Y(lift + 0.05)); ctx.lineTo(X(footX) + hw * 1.3 * d.dir, Y(lift)); ctx.lineTo(X(footX) - hw * 0.9, Y(lift)); ctx.fill();
      if (!pass) { minX = Math.min(minX, X(hipX) - 0.05 * s); maxX = Math.max(maxX, X(hipX) + 0.05 * s, X(footX) + 0.05 * s); }
    }
  }
  d.sx0 = minX - 20; d.sx1 = maxX + 20;
}

/* the grey cat: whiskers and paws */
const FUR = [130, 134, 140];
function furCol(mul) { const L = Math.max(0.55, env.light) * (mul || 1); return rgb([FUR[0] * L, FUR[1] * L, FUR[2] * L]); }
function drawPaw(x, y, r, under) {
  ctx.fillStyle = furCol(1);
  ctx.beginPath(); ctx.moveTo(x - r * 0.82, H + r * 2); ctx.lineTo(x - r * 0.86, y); ctx.lineTo(x + r * 0.86, y); ctx.lineTo(x + r * 0.82, H + r * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.8, 0, 0, TAU); ctx.fill();
  if (!under) {
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(x + i * r * 0.5, y - r * 0.55 + Math.abs(i) * r * 0.12, r * 0.34, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = furCol(0.72); ctx.lineWidth = Math.max(1, r * 0.045); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - r * 0.25, y - r * 0.78); ctx.lineTo(x - r * 0.25, y - r * 0.38); ctx.moveTo(x + r * 0.25, y - r * 0.78); ctx.lineTo(x + r * 0.25, y - r * 0.38); ctx.stroke();
    ctx.lineCap = 'butt'; return;
  }
  const toe = i => [x + (i - 1.5) * r * 0.42, y - r * 0.55 + (i === 0 || i === 3 ? r * 0.14 : 0)];
  for (let i = 0; i < 4; i++) { const t = toe(i); ctx.beginPath(); ctx.arc(t[0], t[1], r * 0.3, 0, TAU); ctx.fill(); }
  const L = Math.max(0.72, env.light); ctx.fillStyle = rgb([214 * L, 152 * L, 162 * L]);
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.12, r * 0.42, r * 0.32, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 4; i++) { const t = toe(i); ctx.beginPath(); ctx.arc(t[0], t[1], r * 0.15, 0, TAU); ctx.fill(); }
}
function drawCat() {
  // walking paws, now and then
  if (pawVis > 0.02) {
    const r = W * 0.085;
    for (let i = 0; i < 2; i++) {
      const ph = stepPh * Math.PI + i * Math.PI, lift = Math.max(0, Math.sin(ph));
      const x = W * (i ? 0.66 : 0.34) + Math.sin(ph) * W * 0.01;
      const y = H + r * 1.1 - (r * 0.9 + lift * H * 0.06) * pawVis;
      drawPaw(x, y, r);
    }
  }
  // a quick bat at whatever was tapped
  if (swipe) {
    const t = swipe.t / 0.55, reach = Math.sin(t * Math.PI), r = W * 0.1;
    const sx = W * (swipe.s < 0 ? 0.3 : 0.7), tx = lerp(sx, swipe.x, 0.5), ty = Math.max(H * 0.35, swipe.y + r);
    drawPaw(lerp(sx, tx, reach), lerp(H + r * 1.6, lerp(H, ty, 0.6), reach), r, true);
  }
  // whiskers
  const tw = clamp(1 - (time - whiskT) / 0.8, 0, 1), lift = Math.sin(tw * Math.PI) * 0.05 + (reduceMotion ? 0 : Math.abs(Math.sin(stepPh * Math.PI)) * 0.006 * Math.min(1, speed));
  ctx.strokeStyle = 'rgba(238,240,244,' + (0.38 + 0.12 * env.day) + ')'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let sd = -1; sd <= 1; sd += 2) for (let i = 0; i < 3; i++) {
    const bx = cx + sd * W * 0.09, by = H + 8;
    const tx = cx + sd * W * (0.6 - i * 0.04), ty = H * (0.83 + i * 0.045 - lift);
    const qx = cx + sd * W * (0.28 + i * 0.02), qy = H * (0.9 - i * 0.01 - lift * 0.6);
    ctx.moveTo(bx, by); ctx.quadraticCurveTo(qx, qy, tx, ty);
  }
  ctx.stroke(); ctx.lineCap = 'butt';
}

function draw() {
  frameNo++;
  buildTable();
  swayAmp = reduceMotion ? 0.01 : 0.03 + (S.wind / 100) * 0.11 * (0.35 + 0.65 * openNow);
  ctx.save();
  if (settle > 0.001) { ctx.translate(cx, H); ctx.rotate(tilt); ctx.scale(zk, zk); ctx.translate(-cx, -H); }
  drawSky(); drawGround(); drawWalls();
  // movers sorted far to near, merged with the world
  const mv = [];
  for (const m of movers) mv.push([m.wz - camD, m]);
  if (deer && deer.on) mv.push([0.9, 'deer']);
  mv.sort((a, b) => b[0] - a[0]);
  let mi = 0;
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i], z = o.wz - camD;
    if (z > ZFAR + 0.5) continue;
    while (mi < mv.length && mv[mi][0] > z) { drawMover(mv[mi]); mi++; }
    if (z < 0.1) continue;
    switch (o.k) {
      case 'g': drawClump(o, z); break;
      case 'stalk': drawStalk(o, z); break;
      case 'flow': drawFlower(o, z); break;
      case 'fern': drawFern(o, z); break;
      case 'tree': drawTree(o, z); break;
      case 'rock': drawRock(o, z); break;
      case 'pond': drawPond(o, z); break;
      case 'bed': drawBed(o, z); break;
      default: if (o.c) drawCrit(o, z);
    }
  }
  while (mi < mv.length) { drawMover(mv[mi]); mi++; }
  drawParts();
  if (rainAmt > 0.01) {
    // rain streaks: thick out in the open, just the odd drip under the grass roof
    const n = Math.floor(drops.length * rainAmt * (0.2 + 0.8 * openNow)), wl = 0.15 + S.wind / 100 * 0.3;
    ctx.strokeStyle = 'rgba(226,234,242,' + (0.3 + 0.12 * env.day) + ')'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i = 0; i < n; i++) { const d = drops[i], x = d.x * W * 1.2 - W * 0.1, y = d.y * H; ctx.moveTo(x, y); ctx.lineTo(x - d.l * wl, y - d.l); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(60,66,72,' + (0.08 * rainAmt) + ')'; ctx.fillRect(-W * 0.2, -H * 0.1, W * 1.4, H * 1.2);
  }
  // shade under the grass roof, open sky in the meadows
  const roof = 1 - openNow;
  if (roof > 0.03) {
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    const rc = shade([30, 56, 30], 0, 1);
    g.addColorStop(0, 'rgba(' + (rc[0] | 0) + ',' + (rc[1] | 0) + ',' + (rc[2] | 0) + ',' + (0.42 * roof) + ')');
    g.addColorStop(1, 'rgba(' + (rc[0] | 0) + ',' + (rc[1] | 0) + ',' + (rc[2] | 0) + ',0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.5);
  }
  if (ended) {
    const a = Math.min(1, endT / 4) * (0.14 + 0.2 * env.night);
    const g = ctx.createRadialGradient(cx, H * 0.7, H * 0.1, cx, H * 0.7, H * 0.8);
    g.addColorStop(0, 'rgba(255,200,140,' + a + ')'); g.addColorStop(1, 'rgba(255,200,140,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  drawCat();
  if (S.glow < 100) { ctx.fillStyle = 'rgba(0,0,0,' + ((100 - S.glow) / 100 * 0.85) + ')'; ctx.fillRect(0, 0, W, H); }
}
function drawMover(e) { if (e[1] === 'deer') drawDeer(0.9); else drawFly(e[1]); }

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0.016; if (dt > 0.1) dt = 0.1;
  time += dt;
  perf(dt); update(dt); draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else if (started) AC.resume();
});

updEnv(); resize(); buildBackdrop(); resetWalk();
window.__lgc = { update, draw, S, get st() { return { camD, speed, objs: objs.length, movers: movers.length, ended, deer, walking, autoHold }; }, start() { started = true; walking = true; }, tap: tapThing, jump(d) { objs = []; movers = []; camD = d; nextSpawn = d + 0.1; bedSpawned = false; rockIdx = rocks.findIndex(r => r >= d); if (rockIdx < 0) rockIdx = rocks.length; pondIdx = ponds.findIndex(q => q.z >= d); if (pondIdx < 0) pondIdx = ponds.length; while (nextSpawn < camD + ZFAR) { spawnAt(nextSpawn); nextSpawn += STEP; } }, get segs() { return segs; }, get ponds() { return ponds; }, get rocks() { return rocks; }, get objs() { return objs; }, rain() { rainOn = true; rainEnd = time + 30; } };
requestAnimationFrame(frame);
})();
</script>
